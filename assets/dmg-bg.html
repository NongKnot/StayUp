<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StayUp DMG background</title>
<style>
  /* DMG window is 540×380. Two icons sit on top of this image at
     (150, 200) and (390, 200) respectively. The arrow between them
     is centered horizontally; the title is above, instruction below. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 540px;
    height: 380px;
    background: #fffaf0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                 "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #1a1a1a;
    position: relative;
    overflow: hidden;
  }

  /* Subtle paper grain — keeps it from looking flat. */
  body::before {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 800px 200px at 50% 0%, rgba(255, 155, 61, 0.06), transparent 70%),
      radial-gradient(ellipse 600px 150px at 50% 100%, rgba(26, 26, 26, 0.04), transparent 70%);
    pointer-events: none;
  }

  .title {
    position: absolute;
    top: 34px; left: 0; right: 0;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .motto {
    position: absolute;
    top: 68px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: #6b6b6b;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Big animated-feeling arrow between the two icon positions.
     Center at x=270. Vertical center sits ~20pt ABOVE the icon
     position centers because Finder reserves ~22pt of label space
     below each icon graphic — so position (150, 200) puts the icon
     GRAPHIC center at ~y=189, not y=200. The arrow now points at
     the duck/folder graphics rather than at the labels below them. */
  .arrow-wrap {
    position: absolute;
    top: 152px;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
  }
  .arrow {
    display: inline-block;
    font-size: 64px;
    color: #ff9b3d;
    font-weight: 200;
    line-height: 1;
    letter-spacing: -4px;
    /* Slight tilt — the duck doesn't walk in straight lines either. */
    transform: rotate(-3deg) translateY(-2px);
  }

  /* Instruction line below the icons. Bumped up + simplified after
     the v1.0 DMG showed the original "drag the duck into Applications.
     lock in." text crowding the icon labels (and the word "Applications"
     reading twice — once as instruction, once as the folder's label). */
  .instruction {
    position: absolute;
    bottom: 28px; left: 0; right: 0;
    text-align: center;
    font-size: 13px;
    color: #6b6b6b;
    font-weight: 500;
  }
  .instruction em {
    font-style: normal;
    color: #1a1a1a;
    font-weight: 600;
  }

  /* Tiny brand stamp bottom right. */
  .stamp {
    position: absolute;
    bottom: 14px; right: 18px;
    font-size: 10px;
    color: #b8a78d;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="title">Stay Up Duck</div>
  <div class="motto">duck's up, all night baby</div>
  <div class="arrow-wrap"><span class="arrow">→</span></div>
  <div class="instruction">drag the duck <em>→</em> lock in.</div>
  <div class="stamp">getstayup.app · v1.0</div>
</body>
</html>
