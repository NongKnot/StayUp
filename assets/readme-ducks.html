<!doctype html>
<!--
  Source for the README duck image.
  Duck peeks over a brick wall (Kilroy pose) — the wall now extends
  edge-to-edge horizontally so the duck feels like he's poking up
  over a much longer wall instead of standing behind a head-sized
  segment.

  Renders at 1200×1000, regenerate via:  bash tools/make-readme-art.sh
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>StayUp · readme duck peek</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    width: 1200px;
    height: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg {
    width: 1140px;
    height: auto;
    display: block;
  }
</style>
</head>
<body>
  <!--
    ViewBox expanded horizontally to 0–400 (full duck SVG width)
    so the wall + bricks fill the entire image edge-to-edge. The
    duck head sits in the middle as before; the hands sit on either
    side of the head; the bricks extend left and right beyond the
    head until they hit the image edge.
  -->
  <svg viewBox="0 -5 400 335" xmlns="http://www.w3.org/2000/svg" aria-label="StayUp duck peeking over a wall">

    <!-- ─── Duck body (back layer; wall will cover below y≈248) ─── -->
    <path fill="#ffffff" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" d="
      M 200 50 C 145 50, 130 110, 138 180
      C 144 240, 142 300, 132 360
      C 122 410, 132 448, 200 452
      C 268 448, 278 410, 268 360
      C 258 300, 256 240, 262 180
      C 270 110, 255 50, 200 50 Z
    "/>

    <!-- ─── Eyes ─── -->
    <circle cx="138" cy="175" r="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
    <circle cx="132" cy="178" r="4.5" fill="#1a1a1a"/>
    <circle cx="262" cy="175" r="34" fill="#ffffff" stroke="#1a1a1a" stroke-width="5"/>
    <circle cx="268" cy="178" r="4.5" fill="#1a1a1a"/>

    <!-- ─── Beak ─── -->
    <path fill="#ff9b3d" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" d="
      M 162 200 C 178 188, 222 188, 238 200
      C 248 214, 232 226, 200 224
      C 168 226, 152 214, 162 200 Z
    "/>
    <circle cx="190" cy="206" r="2.2" fill="#1a1a1a"/>
    <circle cx="210" cy="206" r="2.2" fill="#1a1a1a"/>

    <!-- ─── Wall (extends full image width: x=0 → 400) ─── -->
    <rect x="0" y="248" width="400" height="80" fill="#ff9b3d" stroke="#1a1a1a" stroke-width="4"/>
    <!-- Horizontal mortar line between rows -->
    <line x1="0" y1="288" x2="400" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- Top-row vertical mortars (every 40 units starting from 40) -->
    <line x1="40"  y1="248" x2="40"  y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="80"  y1="248" x2="80"  y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="248" x2="120" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="248" x2="160" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="248" x2="200" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="240" y1="248" x2="240" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="280" y1="248" x2="280" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="248" x2="320" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="360" y1="248" x2="360" y2="288" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <!-- Bottom-row vertical mortars (staggered, offset by 20) -->
    <line x1="20"  y1="288" x2="20"  y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="60"  y1="288" x2="60"  y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="288" x2="100" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="140" y1="288" x2="140" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="288" x2="180" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="288" x2="220" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="260" y1="288" x2="260" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="300" y1="288" x2="300" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="340" y1="288" x2="340" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <line x1="380" y1="288" x2="380" y2="328" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

    <!-- ─── Left hand: 3 finger humps gripping the wall top ─── -->
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 108 252 C 108 234, 124 234, 124 252 Z"/>
      <path d="M 126 252 C 126 228, 144 228, 144 252 Z"/>
      <path d="M 146 252 C 146 234, 162 234, 162 252 Z"/>
    </g>

    <!-- ─── Right hand: mirror ─── -->
    <g fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M 238 252 C 238 234, 254 234, 254 252 Z"/>
      <path d="M 256 252 C 256 228, 274 228, 274 252 Z"/>
      <path d="M 276 252 C 276 234, 292 234, 292 252 Z"/>
    </g>

  </svg>
</body>
</html>
